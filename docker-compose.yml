version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: home-soc-postgres
    environment:
      POSTGRES_DB: homesoc
      POSTGRES_USER: homesoc_user
      POSTGRES_PASSWORD: strongpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: